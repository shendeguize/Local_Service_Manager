port_pool: [8000, 8999]

services:
  enva:
    start: "enva serve -p {port}"
    preferred_port: 8080
    url_from_log: true
  dshc:
    start: "dshc up --port {port}"
    set_port:
      - "dshc config set manager.port {port} --port {current_port}"
      - "dshc restart --port {current_port}"
    status_cmd: "dshc status"
    preferred_port: 7799
    url_from_log: true
  aqp:
    start: "aqp start --port {port} --host 127.0.0.1"
    preferred_port: 8000
    url_from_log: true
  kimi:
    start: "kimi web --port {port} --no-open"
    preferred_port: 8081
    url_from_log: true
  dsh:
    start: "dsh web --port {port} --no-open"
    preferred_port: 3080
    url_from_log: true
  web:
    start: "{python} -m localsm.web --host 127.0.0.1 --port {port}"
    preferred_port: 8765
    url_from_log: true
