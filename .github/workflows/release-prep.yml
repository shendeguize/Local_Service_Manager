name: Release preparation

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Next stable semantic version, for example 0.1.1"
        required: true
        type: string
      date:
        description: "Release date (YYYY-MM-DD); defaults to today"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Update release metadata
        env:
          RELEASE_DATE: ${{ inputs.date }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python scripts/bump_version.py "$RELEASE_VERSION" \
            $([ -n "$RELEASE_DATE" ] && printf '%s' "--date=$RELEASE_DATE" || true)
      - run: uv sync --dev --locked
      - run: make release-preflight
      - name: Open release preparation pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: release-prep/v${{ inputs.version }}
          delete-branch: true
          title: "Prepare release v${{ inputs.version }}"
          commit-message: "Prepare release v${{ inputs.version }}"
          body: |
            ## Release preparation

            This pull request updates the runtime and npm wrapper versions and
            adds the changelog entry for v${{ inputs.version }}.

            The release workflow will publish after this pull request merges
            and the resulting tag is created.
