name: Tag release

on:
  push:
    branches:
      - main
    paths:
      - src/localsm/__init__.py

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create version tag when needed
        id: tag
        shell: bash
        run: |
          VERSION="$(python3 -c 'import re; print(re.search(r"^__version__\s*=\s*\"([^\"]+)\"$", open("src/localsm/__init__.py").read(), re.MULTILINE).group(1))')"
          TAG="v${VERSION}"
          if git rev-parse "$TAG^{commit}" >/dev/null 2>&1; then
            echo "$TAG already exists"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Start the release workflow
        if: ${{ steps.tag.outputs.created == 'true' }}
        # A tag pushed with GITHUB_TOKEN does not raise a push event, so the
        # release workflow has to be dispatched explicitly.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh workflow run release.yml --ref main \
            --field "tag=$TAG" \
            --field "publish_pypi=false"
