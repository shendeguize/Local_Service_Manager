version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /packages/npm
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns:
          - "*"

  # The website's dependencies are separate from the launcher's: they only ever
  # affect what Pages serves, so grouping them apart keeps a docs-tooling bump
  # from looking like a change to the published package.
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    groups:
      site-dependencies:
        patterns:
          - "*"
