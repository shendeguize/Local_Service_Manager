[project]
name = "local-sm"
dynamic = ["version"]
description = "Local service and SSH tunnel manager for macOS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.1,<4",
  "PyYAML>=6.0,<7",
]

[project.scripts]
LocalSM = "localsm.cli:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.16.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=src/localsm --cov-report=term-missing --cov-fail-under=75"

[tool.coverage.run]
branch = true
source = ["src/localsm"]

[tool.coverage.report]
exclude_also = [
  "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = false
precision = 1

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "SIM", "UP"]
ignore = ["SIM102", "SIM105"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localsm"]

[tool.hatch.version]
path = "src/localsm/__init__.py"
