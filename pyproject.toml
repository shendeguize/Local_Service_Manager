[project]
name = "local-sm"
version = "0.1.0"
description = "Local service and SSH tunnel manager for macOS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.1,<4",
  "PyYAML>=6.0,<7",
]

[project.scripts]
LocalSM = "localsm.cli:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/localsm --cov-report=term-missing --cov-fail-under=75"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localsm"]
